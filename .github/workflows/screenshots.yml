name: Store screenshots

# Run by hand from the Actions tab. Starts an emulator, opens each screen in Demo mode
# (made-up people, nothing real), and saves the pictures for the store listings.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the test app
        run: ./gradlew --no-daemon assembleDebug

      - name: Let the emulator use the processor
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pixel 3 shape (1080 x 2160): exactly 2:1, which Google Play accepts.
      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: sh scripts/store_screenshots.sh && SHOT_LANG=es sh scripts/store_screenshots.sh

      - name: Save them with the store listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/*/images/phoneScreenshots
          git commit -m "Store screenshots from Demo mode" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: fastlane/metadata/android/*/images/phoneScreenshots/
