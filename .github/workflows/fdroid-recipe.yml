name: F-Droid recipe

# Run by hand from the Actions tab. Checks fdroid/com.netgician.rplauncher.yml the way F-Droid's
# own reviewers will: in F-Droid's build server image, with their lint, then a real
# `fdroid build` of this commit (scanner included). Takes about an hour with the build.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Also run the full F-Droid build"
        type: boolean
        default: true
      quick:
        description: "Quick: skip building ONNX Runtime (for checking the rest of the build)"
        type: boolean
        default: false

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver
    steps:
      - uses: actions/checkout@v4
        with:
          path: rp-launcher

      # The image has F-Droid's tools' dependencies; the tools themselves come from their git,
      # as in fdroiddata's own pipelines.
      - name: Set up F-Droid's tools
        run: |
          echo "::group::Environment"; ls /etc/profile.d || true; env | grep -i -E 'fdroid|android|ndk' || true; python3 --version; echo "::endgroup::"
          [ -f /etc/profile.d/bsenv.sh ] && . /etc/profile.d/bsenv.sh
          if [ -n "$fdroidserver" ] && [ -x "$fdroidserver/fdroid" ]; then
            FS="$fdroidserver"
          else
            git clone --depth 1 https://gitlab.com/fdroid/fdroidserver.git /opt/fdroidserver-git
            FS=/opt/fdroidserver-git
          fi
          echo "$FS" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$FS:$FS/examples" >> "$GITHUB_ENV"
          echo "PYTHONUNBUFFERED=true" >> "$GITHUB_ENV"
          # Later steps need the build server's settings too (bsenv.sh only sets them for this shell).
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          env | grep -E '^(ANDROID_[A-Z_]*|fdroidserver|GRADLE_USER_HOME|JAVA_HOME)=' >> "$GITHUB_ENV" || true
          echo "::notice title=Android SDK::ANDROID_HOME=$ANDROID_HOME: $(ls "$ANDROID_HOME" 2>&1 | tr '\n' ' ')"
          export PATH="$FS:$PATH" PYTHONPATH="$FS:$FS/examples"
          if ! fdroid --version; then
            pip3 install --break-system-packages -e "$FS" || pip3 install -e "$FS"
            fdroid --version
          fi

      - name: Get F-Droid's app list and add RP Launcher's recipe
        run: |
          git clone --depth 1 https://gitlab.com/fdroid/fdroiddata.git
          cp rp-launcher/fdroid/com.netgician.rplauncher.yml fdroiddata/metadata/
          for f in rp-launcher/fdroid/srclibs/*.yml; do
            n=$(basename "$f")
            if [ -e "fdroiddata/srclibs/$n" ]; then
              echo "::notice title=Source library $n::Already in fdroiddata: $(tr '\n' ' ' < "fdroiddata/srclibs/$n")"
            else
              cp "$f" fdroiddata/srclibs/
              echo "::notice title=Source library $n::Not in fdroiddata yet: add fdroid/srclibs/$n to the merge request"
            fi
          done
          # Until the version is tagged, build the commit being checked.
          TAG=$(grep -m1 'commit:' fdroiddata/metadata/com.netgician.rplauncher.yml | awk '{print $2}')
          if ! git -C rp-launcher ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            sed -i "s/commit: $TAG/commit: $GITHUB_SHA/" fdroiddata/metadata/com.netgician.rplauncher.yml
            echo "::notice title=Version tag::$TAG isn't tagged yet, so this checks commit ${GITHUB_SHA}"
          fi
          cp fdroiddata/metadata/com.netgician.rplauncher.yml recipe-before.yml
          if [ "${{ inputs.quick }}" = "true" ]; then
            python3 - <<'PY'
          import re
          p = "fdroiddata/metadata/com.netgician.rplauncher.yml"
          s = open(p).read()
          s = re.sub(r"    build: .*\n", "", s)
          s = re.sub(r"    gradleprops:\n      - onnxFromSource=true\n", "", s)
          s = re.sub(r"    srclibs:\n(      - .*\n)+", "", s)
          s = re.sub(r"    prebuild:\n(      - .*\n)+", "", s)
          open(p, "w").write(s)
          PY
            echo "::notice title=Quick check::ONNX Runtime is not built from source in this run"
          fi

      - name: F-Droid lint
        run: |
          cd fdroiddata
          [ -f config.yml ] || echo "sdk_path: ${ANDROID_HOME:-/opt/android-sdk}" > config.yml
          fdroid readmeta > ../lint.log 2>&1 || true
          fdroid rewritemeta com.netgician.rplauncher >> ../lint.log 2>&1 && touch ../rewritemeta.ran || true
          diff -u ../recipe-before.yml metadata/com.netgician.rplauncher.yml > ../rewritemeta.diff || true
          fdroid lint com.netgician.rplauncher >> ../lint.log 2>&1 || echo "LINT FAILED" >> ../lint.log
          cd ..
          python3 - <<'PY'
          import re
          log = open("lint.log", errors="replace").read().strip().splitlines()
          diff = open("rewritemeta.diff", errors="replace").read().strip().splitlines()
          esc = lambda xs: "%0A".join(x.replace("%", "%25") for x in xs[:40])
          print(f"::notice title=F-Droid lint::{esc(log) if log else 'No problems found'}")
          import os
          if diff:
              print(f"::warning title=F-Droid rewritemeta::{esc(diff)}")
          elif os.path.exists("rewritemeta.ran"):
              print("::notice title=F-Droid rewritemeta::Recipe is already in F-Droid's format")
          PY

      - name: F-Droid build
        if: inputs.build
        run: |
          command -v sudo >/dev/null || (apt-get update -q && apt-get install -y -q sudo)
          # A clean Gradle home: the image's own one isn't usable by root in this container.
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"
          mkdir -p "$GRADLE_USER_HOME"
          echo "::notice title=Gradle home::was ${GRADLE_HOME_BEFORE:-unset}; now $GRADLE_USER_HOME"
          cd fdroiddata
          set -o pipefail
          fdroid build --verbose --on-server --no-tarball com.netgician.rplauncher:5 2>&1 | tee ../build.log
          echo "env: HOME=$HOME JAVA_HOME=${JAVA_HOME:-} GRADLE_USER_HOME=${GRADLE_USER_HOME:-} GRADLE_OPTS=${GRADLE_OPTS:-}" >> ../build.log

      - name: Look closer at a Gradle failure
        if: failure() && inputs.build
        continue-on-error: true
        run: |
          G=$(ls -d "$HOME"/.cache/gradlew-fdroid/versions/*/bin/gradle 2>/dev/null | head -1)
          [ -n "$G" ] || exit 0
          cd fdroiddata/build/com.netgician.rplauncher
          {
            echo "HOME=$HOME user=$(id -un) JAVA_HOME=${JAVA_HOME:-}"
            java -version 2>&1 | head -1
            ls -la "$HOME" "$HOME/.gradle" 2>&1 | head -20
            find "$HOME/.gradle" -name '*.properties' -maxdepth 4 2>/dev/null | head -5 | while read f; do echo "== $f"; cat "$f"; done
            "$G" --stacktrace --no-daemon -PonnxFromSource=false help 2>&1 | grep -E -A2 "Caused by|NumberFormat|at org.gradle.cache|at org.gradle.internal.file" | head -60
          } > ../../../gradle-debug.log 2>&1
          cd ../../..
          python3 -c "import sys; l=open('gradle-debug.log',errors='replace').read().splitlines(); print('::notice title=Gradle detail::' + '%0A'.join(x.replace('%','%25')[:250] for x in l[:80]))"
      - name: Report the build
        if: always() && inputs.build
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists("build.log"):
              print("::warning title=F-Droid build::No build log"); raise SystemExit
          lines = open("build.log", errors="replace").read().splitlines()
          keep = [l for l in lines if re.search(r"(ERROR|Error|error:|Found |Scanner|scanner|BUILD FAILED|FAILURE|What went wrong|Exception|Caused by|Could not|not found|Unknown|denied|Successfully built|Finished|> Task|gradle |Gradle |JAVA_HOME|GRADLE)", l)]
          seen = []
          for l in keep:
              l = l.strip()[:300]
              if l and l not in seen: seen.append(l)
          tail = [l.strip()[:300] for l in lines[-15:]]
          msg = "%0A".join(x.replace("%", "%25") for x in (seen[-60:] + ["--- last lines ---"] + tail))
          print(f"::notice title=F-Droid build::{msg}")
          PY
          find fdroiddata/unsigned -name '*.apk' -exec ls -l {} \; 2>/dev/null | sed 's/^/::notice title=F-Droid APK::/' || true
