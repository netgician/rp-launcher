name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (the testable rules)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Count tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"::notice title=Testable rules::{t} tests, {f} failures, {e} errors, {s} skipped")
          EOF

      - name: Build the app
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: rp-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Every push to main replaces the "Latest test build" release, so the newest app
      # can be installed straight from a phone.
      - name: Publish latest test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rp-launcher-test.apk
          gh release delete latest-test --yes --cleanup-tag || true
          gh release create latest-test rp-launcher-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest test build" \
            --notes "Test build from commit ${GITHUB_SHA::7}. For testing only, not a release."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
