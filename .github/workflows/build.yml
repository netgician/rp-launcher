name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # True once the owner has added the release key to the repository secrets.
      HAS_KEY: ${{ secrets.RP_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (the testable rules)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest :ocr:test :mms:test 2>&1 | tee gradle-test.log

      - name: Count tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml") + glob.glob("ocr/build/test-results/test/*.xml") + glob.glob("mms/build/test-results/test/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"::notice title=Testable rules::{t} tests, {f} failures, {e} errors, {s} skipped")
          EOF

      - name: Build the app
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log

      # Compiler errors as one annotation, readable without downloading logs.
      - name: Report compile errors
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re
          lines = []
          for p in sorted(glob.glob("gradle-*.log")):
              for l in open(p, errors="replace"):
                  l = l.rstrip()
                  if re.match(r"^(e: |w: .*error|.*error: |FAILURE:|\* What went wrong|AAPT: error)", l) or "Execution failed" in l:
                      lines.append(l.replace("file:///home/runner/work/rp-launcher/rp-launcher/", ""))
          seen = []
          for l in lines:
              if l not in seen: seen.append(l)
          msg = "%0A".join(x.replace("%", "%25").replace("\r", "") for x in seen[:40]) or "No compiler lines found"
          print(f"::error title=Build errors::{msg}")
          EOF

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: rp-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Every push to main replaces the "Latest test build" release, so the newest app
      # can be installed straight from a phone.
      - name: Publish latest test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rp-launcher-test.apk
          gh release delete latest-test --yes --cleanup-tag || true
          gh release create latest-test rp-launcher-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest test build" \
            --notes "Test build from commit ${GITHUB_SHA::7}. For testing only, not a release."

      # The release build: shrunk by R8, one APK per phone type, and a bundle for Play. Signed
      # only when the owner's key is in the repository secrets; otherwise left unsigned.
      - name: Release build
        env:
          RP_KEYSTORE_BASE64: ${{ secrets.RP_KEYSTORE_BASE64 }}
          RP_KEYSTORE_PASSWORD: ${{ secrets.RP_KEYSTORE_PASSWORD }}
          RP_KEY_ALIAS: ${{ secrets.RP_KEY_ALIAS }}
          RP_KEY_PASSWORD: ${{ secrets.RP_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$RP_KEYSTORE_BASE64" ]; then
            echo "$RP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RP_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon -Psplit=true assembleRelease bundleRelease 2>&1 | tee gradle-release.log
          echo "::notice title=Release sizes::$(find app/build/outputs -name '*-release*.apk' -o -name '*.aab' | xargs ls -l | awk '{printf "%s %.1f MB; ", $9, $5/1048576}')"

      # The shrunk release build, signed with the shared test key so it installs over the test
      # build: for checking that shrinking didn't break anything, on a real phone.
      - name: Add release-style test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/app-arm64-v8a-release*.apk | head -1)
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks app/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out rp-launcher-release-test-arm64.apk aligned.apk
          gh release upload latest-test rp-launcher-release-test-arm64.apk --clobber

      - name: Lint (Android version checks and more)
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintDebug > gradle-lint.log 2>&1 || true
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os
          p = "app/build/reports/lint-results-debug.xml"
          if not os.path.exists(p):
              print("::warning title=Lint::No lint report"); raise SystemExit
          issues = ET.parse(p).getroot().findall("issue")
          errs = [i for i in issues if i.get("severity") in ("Error", "Fatal")]
          lines = []
          for i in errs[:25]:
              loc = i.find("location")
              where = (loc.get("file", "").split("/rp-launcher/")[-1] + ":" + loc.get("line", "")) if loc is not None else ""
              lines.append(f"{i.get('id')}: {i.get('message')} ({where})")
          print(f"::notice title=Lint::{len(errs)} errors, {len(issues) - len(errs)} warnings")
          if lines:
              print("::warning title=Lint errors::" + "%0A".join(l.replace("%", "%25") for l in lines))
          EOF

      - name: Publish signed release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          find app/build/outputs/bundle/release -name '*.aab' -exec cp {} out/ \;
          gh release delete latest-release --yes --cleanup-tag || true
          gh release create latest-release out/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest release build" \
            --notes "Signed release build from commit ${GITHUB_SHA::7}: one APK per phone type, and the bundle for Google Play."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            ocr/build/reports/tests/
            mms/build/reports/tests/
          if-no-files-found: ignore
